name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        run: gradle -p android :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neeflow-Launcher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Neeflow-Launcher.apk
          tag="apk-${GITHUB_SHA::12}"
          gh release create "$tag" dist/Neeflow-Launcher.apk \
            --title "Neeflow Launcher APK ${GITHUB_SHA::7}" \
            --notes "Installable Android debug APK built from commit ${GITHUB_SHA}. Minecraft itself is not bundled; see the repository README." \
            --prerelease \
            --target "$GITHUB_SHA"
