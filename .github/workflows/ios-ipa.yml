name: Build Neeflow iOS IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'ios/**'
      - 'scripts/prepare_amethyst_ios.py'
      - 'index.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out Neeflow source
        uses: actions/checkout@v4

      - name: Check out Amethyst iOS source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-iOS
          ref: f98c4133c72d39e06ceac42b57cc4477c52105fc
          path: amethyst
          submodules: recursive

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install native build tools
        run: brew install cmake ldid make

      - name: Prepare Neeflow iOS build
        run: python3 scripts/prepare_amethyst_ios.py amethyst

      - name: Build unsigned sideload IPA
        working-directory: amethyst
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeeflowLauncher-iOS-IPA
          path: amethyst/artifacts/com.neeflow.launcher.ios-*-ios.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp amethyst/artifacts/com.neeflow.launcher.ios-*-ios.ipa dist/NeeflowLauncher-iOS.ipa
          tag="ios-${GITHUB_SHA::12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/NeeflowLauncher-iOS.ipa --clobber
          else
            gh release create "$tag" dist/NeeflowLauncher-iOS.ipa \
              --title "NeeflowLauncher iOS ${GITHUB_SHA::7}" \
              --notes "Unofficial Neeflow iOS launcher IPA built on Amethyst. JIT and game-version compatibility depend on the device and iOS version. The legacy JitStreamer setting is deprecated; modern iOS versions use Amethyst's supported JIT providers." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
